server {
  listen 8080;
  server_tokens off;
  client_max_body_size 1m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  gzip off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ { proxy_pass http://api:3001/; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
