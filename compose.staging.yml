services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mona_staging
      POSTGRES_USER: mona_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U mona_staging"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  migrate:
    build: { context: ., dockerfile: Dockerfile.api }
    command: [node, scripts/migrate.mjs]
    env_file: [.env.example]
    environment: { NODE_ENV: production }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [.env.example]
    environment: { NODE_ENV: production }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      {
        test: [CMD, wget, -qO-, http://127.0.0.1:3001/health/ready],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: [.env.example]
    environment: { NODE_ENV: production }
    depends_on: { migrate: { condition: service_completed_successfully } }
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["8080:8080"]
    depends_on: [api]
secrets:
  db_password:
    file: ./secrets/staging_db_password
