name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: mona_test,
            POSTGRES_PASSWORD: test_only_password,
            POSTGRES_DB: mona_test,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mona_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mona_test:test_only_password@localhost:5432/mona_test
      TEST_DATABASE_URL: postgresql://mona_test:test_only_password@localhost:5432/mona_test
      DATABASE_ADAPTER: postgres
      DATABASE_SSL: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
