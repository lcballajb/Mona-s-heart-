name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: mona_admin,
            POSTGRES_PASSWORD: test_only_admin_password,
            POSTGRES_DB: postgres,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mona_admin -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mona_test:test_only_password@localhost:5432/mona_test
      TEST_DATABASE_URL: postgresql://mona_test:test_only_password@localhost:5432/mona_test
      DATABASE_ADAPTER: postgres
      DATABASE_SSL: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Create non-superuser PostgreSQL test database
        env:
          PGPASSWORD: test_only_admin_password
        run: |
          psql --host localhost --username mona_admin --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE mona_test LOGIN PASSWORD 'test_only_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
          createdb --host localhost --username mona_admin --owner mona_test mona_test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run audit:repository
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
      - run: node scripts/backup.mjs --dry-run
      - run: node scripts/restore-check.mjs --dry-run
      - name: Verify generated commands leave the checkout clean
        run: git diff --exit-code && git diff --check
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
